[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarpal"
version = "0.1.0"
description = "ScholarPal API and scholarship workflows"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
crawler = [
    "beautifulsoup4>=4.13,<5",
    "scrapy>=2.13,<3",
    "trafilatura>=2,<3",
]
postgres = ["psycopg[binary]>=3.2,<4"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
